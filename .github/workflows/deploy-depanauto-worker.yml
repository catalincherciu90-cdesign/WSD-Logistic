name: Deploy DepanAuto Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'depanauto/client/**'
      - 'depanauto/depanator/**'
      - 'depanauto/admin/**'
      - 'depanauto/istoric/**'
      - 'depanauto/legal/**'
      - 'depanauto/icons/**'
      - 'depanauto/fcm-init.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4
      - name: Build static assets
        run: bash worker/build.sh
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
