name = "wsdlogistic"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Variabile publice (nesensibile). ALLOWED_ORIGIN: pune domeniul real in productie.
[vars]
ALLOWED_ORIGIN = "*"

# Secrete (NU le pune aici) — seteaza-le cu:
#   wrangler secret put ORS_KEY
#   wrangler secret put FIREBASE_CREDENTIALS   (lipesti tot JSON-ul service account)

# Frontend static servit din acelasi Worker. Vezi worker/build.sh care genereaza ./public.
[assets]
directory = "./public"
binding = "ASSETS"

# Baza de date D1. Provizionata deja (regiune EEUR).
[[d1_databases]]
binding = "DB"
database_name = "depanauto"
database_id = "9c38c00f-6224-4147-bf8e-fc570096e1d8"
